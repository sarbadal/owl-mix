<svg width="100%" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">

  {% set x_min = item_scaler.x_min %}
  {% set x_q1 = item_scaler.x_q1 %}
  {% set x_median = item_scaler.x_median %}
  {% set x_mean = item_scaler.x_mean %}
  {% set x_q3 = item_scaler.x_q3 %}
  {% set x_max = item_scaler.x_max %}
  {% set ticks = item_scaler.ticks %}
  {% set outliers_x = item_scaler.x_outliers %}
  <!-- ========================= -->
  <!-- OPTIONAL GRID LINES -->
  <!-- ========================= -->
  {% for t in ticks %}
    <line x1="{{ t.x }}" x2="{{ t.x }}"
          y1="45" y2="90"
          stroke="#e0e0e0" stroke-dasharray="2"/>
  {% endfor %}

  <!-- ========================= -->
  <!-- BOX PLOT -->
  <!-- ========================= -->

  <!-- Left whisker -->
  <line x1="{{ x_min }}" x2="{{ x_q1 }}"
        y1="60" y2="60"
        stroke="black" stroke-width="2"/>

  <!-- Right whisker -->
  <line x1="{{ x_q3 }}" x2="{{ x_max }}"
        y1="60" y2="60"
        stroke="black" stroke-width="2"/>

  <!-- Min cap -->
  <line x1="{{ x_min }}" x2="{{ x_min }}"
        y1="55" y2="65"
        stroke="black" stroke-width="2"/>

  <!-- Max cap -->
  <line x1="{{ x_max }}" x2="{{ x_max }}"
        y1="55" y2="65"
        stroke="black" stroke-width="2"/>

  <!-- Box (Q1 → Q3) -->
  <rect x="{{ x_q1 }}"
        y="45"
        width="{{ x_q3 - x_q1 }}"
        height="30"
        fill="#4CAF50"
        opacity="0.6"/>

  <!-- Median -->
  <line x1="{{ x_median }}" x2="{{ x_median }}"
        y1="45" y2="75"
        stroke="black" stroke-width="2"/>

  <!-- Mean (dashed) -->
  <line x1="{{ x_mean }}" x2="{{ x_mean }}"
        y1="45" y2="75"
        stroke="red" stroke-width="2"
        stroke-dasharray="4"/>

  <!-- Outliers -->
  {% for x in outliers_x %}
    {% set y_jitter = ((loop.index0 % 9) - 4) * 1.8 %}
    <circle cx="{{ x }}" cy="{{ 60 + y_jitter }}" r="2" fill="red"/>
  {% endfor %}

  <!-- ========================= -->
  <!-- X-AXIS -->
  <!-- ========================= -->

  <!-- Axis line -->
  <line x1="{{ ticks[0].x }}" x2="{{ ticks[-1].x }}"
        y1="90" y2="90"
        stroke="black" stroke-width="1.5"/>

  <!-- Tick marks + labels -->
  {% for t in ticks %}
    <!-- Tick -->
    <line x1="{{ t.x }}" x2="{{ t.x }}"
          y1="90" y2="95"
          stroke="black"/>
    <!-- Label -->
    <text x="{{ t.x }}" y="110"
          font-size="10"
          fill="#333"
          text-anchor="middle">
      {{ t.label }}
    </text>
  {% endfor %}

</svg>
