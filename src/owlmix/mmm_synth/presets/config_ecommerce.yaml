seed: 42
 
dataset:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  frequency: "weekly"
 
target:
  name: daily_orders
  base_level: 5000
  trend: 0.05
  seasonality:
    yearly_amplitude: 0.3
    weekly_amplitude: 0.1
 
media_channels:
  - name: facebook_ads_spend
    distribution: gamma
    params:
      shape: 2
      scale: 1000
 
  - name: google_search_clicks
    distribution: lognormal
    params:
      mean: 5.5
      sigma: 0.5

  - name: display_impressions
    distribution: lognormal
    params:
      mean: 13
      sigma: 0.5
 
  - name: influencer_spend
    distribution: gamma
    params:
      shape: 2
      scale: 300
 
  - name: affiliate_clicks
    distribution: lognormal
    params:
      mean: 10
      sigma: 0.2
 
control_variables:
  discount_rate:
    distribution: uniform
    low: 0
    high: 0.5
 
  website_traffic:
    distribution: lognormal
    params:
      mean: 12
      sigma: 0.3
 
  competitor_price_index:
    distribution: normal
    mean: 100
    std: 5
 
transformations:
  facebook_ads_spend:
    adstock: 0.5
    saturation: hill
 
  google_search_clicks:
    adstock: 0.2
    saturation: log
 
  display_impressions:
    adstock: 0.4
    saturation: sqrt
 
channel_coefs:

  facebook_ads_spend:
    coefficient: 0.03
    adstock: 0.5
    saturation: 0.5
 
  google_search_clicks:
    coefficient: 0.02
    adstock: 0.2
    saturation: 0.3
 
  display_impressions:
    coefficient: 0.01
    adstock: 0.4
    saturation: 0.2

  influencer_spend:
    coefficient: 0.015
    adstock: 0.3
    saturation: 0.4

  affiliate_clicks:
    coefficient: 0.01
    adstock: 0.2
    saturation: 0.3
 
multicollinearity:
  - base: facebook_ads_spend
    correlated_with: display_impressions
    strength: 0.8

noise:
  type: gaussian
  std: 200