seed: 42
 
dataset:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  frequency: "weekly"
 
target:
  name: weekly_new_subscribers
  base_level: 3000
  seasonality:
    yearly_amplitude: 0.25
    weekly_amplitude: 0.15
 
media_channels:
  
  - name: tv_grps
    distribution: normal
    params:
      mean: 150
      std: 40
 
  - name: digital_video_views
    distribution: lognormal
    params:
      mean: 12
      sigma: 0.4
 
  - name: paid_search_clicks
    distribution: lognormal
    params:
      mean: 10
      sigma: 0.3
 
  - name: sms_campaign_volume
    distribution: normal
    params:
      mean: 50000
      std: 10000
 
  - name: call_center_outreach
    distribution: normal
    params:
      mean: 20000
      std: 5000
 
control_variables:
  pricing_index:
    distribution: normal
    mean: 100
    std: 4
 
  network_quality_index:
    distribution: normal
    mean: 85
    std: 5
 
  competitor_offer_index:
    distribution: normal
    mean: 90
    std: 10
 
transformations:
  tv_grps:
    adstock: 0.6
    saturation: hill
 
  digital_video_views:
    adstock: 0.4
    saturation: log
 
  paid_search_clicks:
    adstock: 0.3
    saturation: sqrt
 
channel_coefs:

  tv_grps:
    coefficient: 0.07
    adstock: 0.6
    saturation: 0.7

  digital_video_views:
    coefficient: 0.00002
    adstock: 0.4
    saturation: 0.3

  paid_search_clicks:
    coefficient: 0.003
    adstock: 0.3
    saturation: 0.2

  sms_campaign_volume:
    coefficient: 0.0005
    adstock: 0.2
    saturation: 0.1
    
  call_center_outreach:
    coefficient: 0.0007
    adstock: 0.2
    saturation: 0.1
 
multicollinearity:
  - base: digital_video_views
    correlated_with: paid_search_clicks
    strength: 0.75

noise:
  type: gaussian
  std: 150