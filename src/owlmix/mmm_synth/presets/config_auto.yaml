seed: 42
 
dataset:
  start_date: "2020-01-01"
  end_date: "2025-12-31"
  frequency: "weekly"
 
target:
  name: weekly_vehicle_sales
  base_level: 800
  noise_std: 40
 
media_channels:
  - name: "tv_grps"
    type: "grps"
    distribution: "normal"
    params:
      mean: 120
      std: 30
 
  - name: "digital_video_impressions"
    type: "impressions"
    distribution: "lognormal"
    params:
      mean: 12
      sigma: 0.4
 
  - name: "paid_search_clicks"
    type: "clicks"
    distribution: "lognormal"
    params:
      mean: 10
      sigma: 0.5
 
  - name: "radio_spend"
    type: "spend"
    distribution: "gamma"
    params:
      shape: 2
      scale: 200
 
  - name: "ooh_impressions"
    type: "impressions"
    distribution: "normal"
    params:
      mean: 50000
      std: 10000
 
  - name: "print_newspaper_circulation"
    type: "circulation"
    distribution: "normal"
    params:
      mean: 200000
      std: 40000
 
control_variables:
  price_index:
    distribution: normal
    mean: 100
    std: 5
 
  dealer_count:
    distribution: normal
    mean: 150
    std: 10
 
  competitor_spend_index:
    distribution: normal
    mean: 80
    std: 15
 
transformations:
  tv_grps:
    adstock: 0.6
    saturation: hill
 
  digital_video_impressions:
    adstock: 0.4
    saturation: log
 
  paid_search_clicks:
    adstock: 0.3
    saturation: sqrt
 
  radio_spend:
    adstock: 0.5
    saturation: log
 
channel_coefs:
  tv_grps: 
    coefficient: 0.05
    adstock: 0.6
    saturation: 0.7

  digital_video_impressions:
    coefficient: 0.03
    adstock: 0.4
    saturation: 0.6

  paid_search_clicks:
    coefficient: 0.02
    adstock: 0.3
    saturation: 0.5

  ooh_impressions:
    coefficient: 0.015
    adstock: 0.7
    saturation: 0.6

  print_newspaper_circulation:
    coefficient: 0.01
    adstock: 0.8
    saturation: 0.5

  radio_spend:
    coefficient: 0.025
    adstock: 0.5
    saturation: 0.65
 
multicollinearity:
  - channels: ["tv_grps", "ooh_impressions"]
    correlation: 0.7

  - channels: ["digital_video_impressions", "paid_search_clicks"]
    correlation: 0.6

noise:
  type: gaussian
  std: 100